name: Gerar Relatório de Pendências

on:
  push:
    paths:
      - 'data/**.xlsx'
      - 'scripts/**.py'

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  gerar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install pandas openpyxl

      - name: Encontrar arquivos Excel e gerar relatório
        run: |
          python scripts/encontrar_e_gerar.py

      - name: Commitar arquivos gerados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add data/historico/historico_baixas.xlsx || true
          git diff --staged --quiet || git commit -m "chore: atualiza relatório e histórico [skip ci]"
          git push

  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
